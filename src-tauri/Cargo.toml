[package]
name = "api-pulse"
version = "0.1.0"
description = "API & DB testing tool"
edition = "2021"
rust-version = "1.85"

[lib]
name = "api_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "gzip", "brotli", "deflate", "multipart", "stream", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
base64 = "0.22"
encoding_rs = "0.8"
roxmltree = "0.21"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
rust_decimal = "1"
futures-util = "0.3"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.12", default-features = false, features = ["winauth"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
