name: api-pulse-dev

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DEV_DB_PASSWORD:-ApiPulse_dev_1}
    ports: ["14330:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 5s
      retries: 30

  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DEV_DB_PASSWORD:-ApiPulse_dev_1}
    volumes: ["./dev/seed:/seed:ro"]
    entrypoint: ["/bin/sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /seed/mssql.sql -b"]
    restart: "no"

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "https"]
    ports: ["8081:8081", "1234:1234"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apipulse
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-ApiPulse_dev_1}
      POSTGRES_DB: apipulse
    ports: ["54320:5432"]
    volumes: ["./dev/seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD:-ApiPulse_dev_1}
      MYSQL_DATABASE: apipulse
    ports: ["33060:3306"]
    volumes: ["./dev/seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_DB_PASSWORD:-ApiPulse_dev_1}
      MARIADB_DATABASE: apipulse
    ports: ["33070:3306"]
    volumes: ["./dev/seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
